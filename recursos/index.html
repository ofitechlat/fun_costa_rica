<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuckup Nights - Selector de Memes para Anécdotas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c0f17;
      --card-bg: rgba(26, 31, 46, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #ff4757;
      --accent-glow: rgba(255, 71, 87, 0.35);
      --accent-secondary: #ffa502;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
      --tag-bg: rgba(255, 71, 87, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #1e152a 0%, var(--bg-main) 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 24px 20px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 32px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255, 71, 87, 0.2);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 0%, #ff6b81 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 650px;
      margin: 0 auto;
    }

    .search-panel {
      max-width: 850px;
      margin: 0 auto 36px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }

    textarea#storyInput {
      width: 100%;
      height: 90px;
      background: rgba(12, 15, 23, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      resize: vertical;
      transition: all 0.2s ease;
    }

    textarea#storyInput:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .chips-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn:hover, .chip-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .stats-bar {
      max-width: 1200px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 0 8px;
    }

    .grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .meme-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .meme-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 71, 87, 0.5);
    }

    .img-wrap {
      width: 100%;
      height: 220px;
      background: #000;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s;
    }

    .meme-card:hover .img-wrap img {
      transform: scale(1.04);
    }

    .source-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #fff;
    }

    .source-badge.hd {
      color: #2ed573;
      border: 1px solid #2ed573;
    }

    .source-badge.classic {
      color: #ffa502;
      border: 1px solid #ffa502;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-cat {
      font-size: 12px;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
      font-family: 'Outfit', sans-serif;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 14px;
      flex-grow: 1;
      line-height: 1.4;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 14px;
    }

    .tag-pill {
      background: var(--tag-bg);
      color: #ff6b81;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-select {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
      text-decoration: none;
    }

    .btn-select:hover {
      background: #ff6b81;
    }

    .match-score {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 71, 87, 0.95);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Fuckup Nights Edition</div>
    <h1>Buscador Instantáneo de Memes para Fracasos</h1>
    <p class="subtitle">Pega o escribe la anécdota del asistente. El sistema filtra y puntúa al instante sin necesidad de IA ni modelos pesados.</p>
  </header>

  <div class="search-panel">
    <div class="input-group">
      <textarea id="storyInput" placeholder="Ejemplo: 'Subí un script a producción sin WHERE y borré todos los clientes antes de la demo con los inversionistas...'"></textarea>
    </div>
    <div class="quick-chips">
      <span class="chips-label">Filtros rápidos:</span>
      <button class="chip-btn" onclick="applyQuickFilter('produccion fuego borrar base de datos')">🔥 Se cayó producción</button>
      <button class="chip-btn" onclick="applyQuickFilter('inversion dinero se fue presupuesto quebrar')">💸 Se acabó el dinero</button>
      <button class="chip-btn" onclick="applyQuickFilter('decision dilema elegir mal atajo')">🤷 Mala decisión / Dilema</button>
      <button class="chip-btn" onclick="applyQuickFilter('culpa verguenza yo no fui disimular')">🫣 Disimular culpa</button>
      <button class="chip-btn" onclick="applyQuickFilter('cliente espera nunca respondio demora')">⏳ Esperando al cliente</button>
      <button class="chip-btn" onclick="resetFilter()">✨ Mostrar Todos</button>
    </div>
  </div>

  <div class="stats-bar">
    <span id="resultsCount">Cargando catálogo...</span>
    <span>💡 44 memes curados listos para tarjetas</span>
  </div>

  <div class="grid" id="memesGrid"></div>

  <script>
    let catalog = [];

    // Cargar catálogo de memes curados
    async function loadCatalog() {
      try {
        const res = await fetch('memes_fun_curados/catalog_fun.json');
        catalog = await res.json();
        renderMemes(catalog);
      } catch (err) {
        document.getElementById('resultsCount').innerText = "Error cargando catálogo: " + err;
      }
    }

    // Normalizador de texto simple (sin acentos, minúsculas)
    function normalize(text) {
      return text.toLowerCase()
                 .normalize("NFD")
                 .replace(/[\u0300-\u036f]/g, "")
                 .replace(/[^a-z0-9\s]/g, " ");
    }

    // Búsqueda y ponderación semántica por palabras clave
    function searchMemes(query) {
      if (!query.trim()) {
        renderMemes(catalog);
        return;
      }

      const qTokens = normalize(query).split(/\s+/).filter(t => t.length > 2);
      
      const scored = catalog.map(meme => {
        let score = 0;
        const nameNorm = normalize(meme.name);
        const catNorm = normalize(meme.categoria || "");
        const descNorm = normalize(meme.descripcion || "");
        const tagsNorm = (meme.tags || []).map(normalize);

        qTokens.forEach(token => {
          // Coincidencia exacta con tags clave (peso alto)
          tagsNorm.forEach(tag => {
            if (tag.includes(token)) score += 3;
            if (tag === token) score += 5;
          });

          // Coincidencia en título o categoría
          if (nameNorm.includes(token)) score += 4;
          if (catNorm.includes(token)) score += 3;
          if (descNorm.includes(token)) score += 2;
        });

        return { ...meme, score };
      });

      // Ordenar por puntaje si hay coincidencias, o mostrar relevantes
      const filtered = scored.filter(m => m.score > 0).sort((a, b) => b.score - a.score);
      
      if (filtered.length > 0) {
        renderMemes(filtered, true);
      } else {
        renderMemes(catalog, false, true);
      }
    }

    function renderMemes(items, showScore = false, noMatch = false) {
      const container = document.getElementById('memesGrid');
      const counter = document.getElementById('resultsCount');

      if (noMatch) {
        counter.innerHTML = `<span style="color:#ffa502">No hubo coincidencias exactas con la anécdota. Mostrando todos los memes disponibles:</span>`;
      } else {
        counter.innerText = `Mostrando ${items.length} meme${items.length === 1 ? '' : 's'} disponible${items.length === 1 ? '' : 's'}`;
      }

      container.innerHTML = items.map(m => {
        const isHd = m.source.includes("HD");
        return `
          <div class="meme-card">
            <div class="img-wrap">
              ${showScore && m.score > 0 ? `<div class="match-score">★ Match ${m.score}</div>` : ''}
              <span class="source-badge ${isHd ? 'hd' : 'classic'}">${isHd ? 'HD' : 'Classic'}</span>
              <img src="memes_fun_curados/${m.file}" alt="${m.name}" loading="lazy">
            </div>
            <div class="card-body">
              <div class="card-cat">${m.categoria || 'Fuckup Night'}</div>
              <h3 class="card-title">${m.name}</h3>
              <p class="card-desc">${m.descripcion || ''}</p>
              <div class="card-tags">
                ${(m.tags || []).slice(0, 4).map(t => `<span class="tag-pill">#${t}</span>`).join('')}
              </div>
              <div class="card-actions">
                <a href="memes_fun_curados/${m.file}" target="_blank" class="btn-select">Ver Imagen</a>
                <button class="btn-select" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);" onclick="copyFileName('${m.file}')">Copiar Nombre</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyQuickFilter(query) {
      document.getElementById('storyInput').value = query;
      searchMemes(query);
    }

    function resetFilter() {
      document.getElementById('storyInput').value = "";
      renderMemes(catalog);
    }

    function copyFileName(filename) {
      navigator.clipboard.writeText(filename);
      alert('Nombre copiado para la tarjeta: ' + filename);
    }

    document.getElementById('storyInput').addEventListener('input', (e) => {
      searchMemes(e.target.value);
    });

    loadCatalog();
  </script>
</body>
</html>
